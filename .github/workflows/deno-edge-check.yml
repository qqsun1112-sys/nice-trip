name: Deno edge function check
on:
  pull_request:
    paths:
      - "supabase/functions/report-transfer-link/**"
      - "supabase/functions/submit-registration/**"
      - ".github/workflows/deno-edge-check.yml"
  workflow_dispatch:
jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/report-transfer-link/index.ts
      - run: deno check supabase/functions/submit-registration/index.ts
