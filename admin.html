<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>網站內容管理｜美遊記 NICE TRIP</title>
<style>
:root{--ink:#164b57;--teal:#17677a;--gold:#a17d3d;--soft:#f4f8f6;--line:#dce7e4;--danger:#9b3d35}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#294a50;background:#f7faf9}button,input,select,textarea{font:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line);padding:18px 0}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:var(--ink);font-size:22px}.brand small{display:block;font-size:10px;letter-spacing:.2em}.hero{padding:42px 0 20px}.hero h1{margin:0;color:var(--ink);font-family:serif;font-size:40px}.hero p{color:#60767a}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:18px 0}.login{max-width:520px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:800;color:var(--ink)}input,select,textarea{width:100%;border:1px solid #ccdcd8;border-radius:9px;padding:11px 12px;background:#fff}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--teal);border:1px solid var(--teal)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #d9aaa5}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;cursor:pointer}.tab.active{background:var(--teal);color:#fff}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:14px}.item h3{margin:0 0 5px;color:var(--ink)}.item p{margin:0;color:#6c7e81;font-size:14px}.badge{display:inline-block;border-radius:999px;background:#eef6f3;padding:3px 9px;font-size:12px;margin-right:6px}.actions{display:flex;gap:8px;align-items:start}.editor{display:none}.editor.open{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.note{background:#fff8e9;border-left:4px solid var(--gold);padding:13px 15px;margin:14px 0;font-size:14px}.status{min-height:22px;font-size:14px;margin-top:8px}.uploadBox{border:1px dashed #b7cfca;border-radius:12px;padding:12px;background:#fbfdfc}.uploadBox input[type=file]{border:0;padding:6px 0}.preview{display:none;margin-top:10px;max-width:100%;height:150px;object-fit:cover;border-radius:9px}.preview.show{display:block}.hint{font-size:12px;color:#71878a;margin-top:5px}.hidden{display:none!important}@media(max-width:760px){.grid2,.grid4{grid-template-columns:1fr}.item{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.actions{flex-wrap:wrap}.hero h1{font-size:32px}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand">美遊記<small>NICE TRIP CONTENT MANAGER</small></div><a href="index.html">返回官網</a></div></header>
<main class="wrap"><section class="hero"><h1>網站內容管理</h1><p>管理活動、文章、圖片與發布狀態。此頁不管理報名者個資。</p></section>
<section id="loginPanel" class="panel login"><h2>管理者登入</h2><div class="field"><label>電子郵件</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">登入管理</button><div id="loginStatus" class="status"></div></section>
<section id="app" class="hidden">
<div class="tabs"><button class="tab active" data-view="activities">活動管理</button><button class="tab" data-view="articles">文章管理</button><button class="tab" id="logoutBtn">登出</button></div>
<div class="note">活動結束或暫停公開時，建議使用「下架／封存」，不要直接刪除。圖片可直接選檔上傳；支援 JPG、PNG、WebP，單檔上限 5MB。</div>
<div class="toolbar"><div><strong id="sectionTitle">活動管理</strong><div id="loadStatus" class="status"></div></div><button class="btn" id="newBtn">＋ 新增活動</button></div>
<div id="editor" class="panel editor"></div><div id="list" class="list"></div>
</section></main>
<script>
const SB_URL="https://eanxqqctblwfhtdrhwuk.supabase.co";
const SB_KEY="sb_publishable_C_5cBiXJWq2zVyWmgnMZbQ_W4aonYIy";
let token=sessionStorage.getItem("nt_admin_token")||"", view="activities", records=[];
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function auth(path,body){const r=await fetch(SB_URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||"登入失敗");return d}
async function api(table,opts={}){const headers={apikey:SB_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json",Prefer:opts.prefer||"return=representation"};const r=await fetch(SB_URL+"/rest/v1/"+table+(opts.query||""),{method:opts.method||"GET",headers,body:opts.body?JSON.stringify(opts.body):undefined});if(!r.ok)throw new Error((await r.text())||"資料操作失敗");return r.status===204?[]:r.json()}
$("#loginBtn").onclick=async()=>{try{$("#loginStatus").textContent="登入中…";const d=await auth("token?grant_type=password",{email:$("#email").value.trim(),password:$("#password").value});token=d.access_token;sessionStorage.setItem("nt_admin_token",token);showApp()}catch(e){$("#loginStatus").textContent=e.message}};
$("#logoutBtn").onclick=()=>{sessionStorage.removeItem("nt_admin_token");token="";location.reload()};
function showApp(){$("#loginPanel").classList.add("hidden");$("#app").classList.remove("hidden");load()}
function table(){return view==="activities"?"site_activities":"site_articles"}
async function load(){try{$("#loadStatus").textContent="讀取中…";records=await api(table(),{query:"?select=*&order=sort_order.asc,created_at.desc"});renderList();$("#loadStatus").textContent="共 "+records.length+" 筆"}catch(e){$("#loadStatus").textContent=e.message;if(/JWT|token|401/i.test(e.message)){sessionStorage.removeItem("nt_admin_token")}}}
function renderList(){const el=$("#list");el.innerHTML=records.map(r=>`<div class="item"><div><h3>${esc(r.title)}</h3><p><span class="badge">${esc(view==="activities"?r.service:r.publisher)}</span><span class="badge">${r.published?"已發布":"未發布"}</span>${view==="activities"?'<span class="badge">'+esc(r.status)+'</span>':""}</p><p>${esc(view==="activities"?(r.event_date||"日期未定"):(r.published_at||"日期未定"))}</p></div><div class="actions"><button class="btn secondary" onclick="editRecord('${r.id}')">編輯</button><button class="btn secondary" onclick="togglePublish('${r.id}',${!r.published})">${r.published?"下架":"發布"}</button></div></div>`).join("")||'<div class="panel">目前沒有資料。</div>'}
document.querySelectorAll(".tab[data-view]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab[data-view]").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;$("#sectionTitle").textContent=view==="activities"?"活動管理":"文章管理";$("#newBtn").textContent=view==="activities"?"＋ 新增活動":"＋ 新增文章";$("#editor").classList.remove("open");load()});
$("#newBtn").onclick=()=>openEditor({});
window.editRecord=id=>openEditor(records.find(x=>x.id===id)||{});
window.togglePublish=async(id,published)=>{const rec=records.find(x=>x.id===id);if(published){const problems=validateRecord(rec,true,id);if(problems.length){alert("發布前請先完成：\n・"+problems.join("\n・"));return}}try{await api(table(),{method:"PATCH",query:"?id=eq."+encodeURIComponent(id),body:{published}});load()}catch(e){alert(e.message)}};
function usedImages(exceptId){const keys=view==="activities"?["home_image","listing_image","detail_image","social_image"]:["image","social_image"];const map=new Map();records.filter(x=>x.id!==exceptId).forEach(x=>keys.forEach(k=>{if(x[k])map.set(x[k],x.title)}));return map}
function duplicateImages(r,exceptId){const keys=view==="activities"?["home_image","listing_image","detail_image","social_image"]:["image","social_image"],seen=new Map(),p=[];keys.forEach(k=>{const v=r[k];if(!v)return;if(seen.has(v))p.push("同一筆內容重複使用相同圖片");else seen.set(v,k)});const used=usedImages(exceptId);keys.forEach(k=>{if(r[k]&&used.has(r[k]))p.push("圖片已用於「"+used.get(r[k])+"」")});return [...new Set(p)]}
function validateRecord(r,publishing=false,exceptId=""){const p=[];if(!r.slug)p.push("識別碼");if(!r.title)p.push("標題");if(view==="activities"){if(!r.service)p.push("四大服務分類");if(publishing&&r.status==="open"){if(!r.event_date)p.push("開放報名活動必須有日期");if(!r.official_url&&!r.accupass_url)p.push("開放報名活動必須有報名入口")}if(r.start_time&&r.end_time&&r.start_time>=r.end_time)p.push("結束時間必須晚於開始時間");if(r.registration_deadline&&r.event_date&&r.registration_deadline.slice(0,10)>r.event_date)p.push("報名截止不可晚於活動日期")}else{if(!r.category)p.push("文章分類");if(!r.publisher)p.push("刊登媒體");if(!r.external_url)p.push("正式文章網址");if(publishing&&!r.published_at)p.push("刊登日期")}if(publishing)p.push(...duplicateImages(r,exceptId));return p}
function f(label,name,value="",type="text"){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`}
function imageField(label,name,value=""){const id="file_"+name;return `<div class="field uploadBox"><label>${label}</label><input name="${name}" type="url" value="${esc(value)}" placeholder="圖片網址會自動填入"><input id="${id}" type="file" accept="image/jpeg,image/png,image/webp" data-target="${name}"><div class="hint">可直接選擇圖片；建議橫式 16:9、WebP/JPG，5MB 以下。</div><img class="preview ${value?"show":""}" src="${esc(value)}" alt=""></div>`}
async function uploadImage(file,target){if(!file)return;if(file.size>5242880)throw new Error("圖片超過 5MB");if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw new Error("僅支援 JPG、PNG、WebP");const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const safe=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));const path=(view==="activities"?"activities/":"articles/")+safe+"."+ext;const r=await fetch(SB_URL+"/storage/v1/object/site-media/"+path,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+token,"Content-Type":file.type,"x-upsert":"false"},body:file});if(!r.ok)throw new Error((await r.text())||"圖片上傳失敗");return SB_URL+"/storage/v1/object/public/site-media/"+path}
function bindUploads(){document.querySelectorAll('input[type="file"][data-target]').forEach(inp=>inp.onchange=async()=>{const target=inp.dataset.target,urlInput=document.querySelector('[name="'+target+'"]'),box=inp.closest(".uploadBox"),img=box.querySelector(".preview");try{inp.disabled=true;const url=await uploadImage(inp.files[0],target);urlInput.value=url;img.src=url;img.classList.add("show")}catch(e){alert(e.message)}finally{inp.disabled=false}})}
function openEditor(r){const e=$("#editor");e.classList.add("open");if(view==="activities"){e.innerHTML=`<h2>${r.id?"編輯活動":"新增活動"}</h2><form id="editForm" data-id="${esc(r.id||"")}"><div class="grid2">${f("活動識別碼（英文／數字）","slug",r.slug)}<div class="field"><label>四大服務</label><select name="service"><option value="city">城市故事行旅</option><option value="temple">廟語心聲</option><option value="meditation">百八鐘靜心運動</option><option value="relaxation">身心放鬆術</option></select></div></div>${f("活動名稱","title",r.title)}<div class="field"><label>摘要</label><textarea name="summary">${esc(r.summary||"")}</textarea></div><div class="grid4">${f("日期","event_date",r.event_date,"date")}${f("開始","start_time",r.start_time,"time")}${f("結束","end_time",r.end_time,"time")}${f("報名截止","registration_deadline",r.registration_deadline,"datetime-local")}</div><div class="grid2">${f("集合地點","meeting_point",r.meeting_point)}${f("票價說明","price_label",r.price_label)}</div><div class="grid2"><div class="field"><label>狀態</label><select name="status"><option value="upcoming">即將公布</option><option value="open">開放報名</option><option value="full">已額滿</option><option value="postponed">延期</option><option value="cancelled">取消</option><option value="ended">活動結束</option></select></div>${f("官網報名頁","official_url",r.official_url)}</div>${f("ACCUPASS 備用金流網址","accupass_url",r.accupass_url,"url")}<h3>視覺圖片</h3><div class="grid2">${imageField("首頁圖片","home_image",r.home_image)}${imageField("活動列表圖片","listing_image",r.listing_image)}${imageField("活動詳情圖片","detail_image",r.detail_image)}${imageField("社群分享圖片","social_image",r.social_image)}</div>${f("圖片替代文字","image_alt",r.image_alt)}<label><input name="published" type="checkbox" ${r.published?"checked":""} style="width:auto"> 發布到官網</label><div class="actions" style="margin-top:18px"><button class="btn" type="submit">儲存</button><button class="btn secondary" type="button" onclick="closeEditor()">取消</button></div><div class="status" id="saveStatus"></div></form>`;e.querySelector('[name="service"]').value=r.service||"city";e.querySelector('[name="status"]').value=r.status||"upcoming"}else{e.innerHTML=`<h2>${r.id?"編輯文章":"新增文章"}</h2><form id="editForm" data-id="${esc(r.id||"")}"><div class="grid2">${f("文章識別碼（英文／數字）","slug",r.slug)}<div class="field"><label>分類</label><select name="category"><option value="city">城市文化</option><option value="faith">信仰文化</option><option value="travel">旅行觀察</option><option value="wellness">身心生活</option></select></div></div>${f("文章標題","title",r.title)}<div class="field"><label>摘要</label><textarea name="excerpt">${esc(r.excerpt||"")}</textarea></div><div class="grid2">${f("刊登媒體","publisher",r.publisher)}${f("刊登日期","published_at",r.published_at,"date")}</div>${f("正式文章網址","external_url",r.external_url,"url")}<div class="grid2">${imageField("封面圖片","image",r.image)}${imageField("社群分享圖片","social_image",r.social_image)}</div>${f("圖片替代文字","image_alt",r.image_alt)}<label><input name="published" type="checkbox" ${r.published?"checked":""} style="width:auto"> 發布到官網</label><div class="actions" style="margin-top:18px"><button class="btn" type="submit">儲存</button><button class="btn secondary" type="button" onclick="closeEditor()">取消</button></div><div class="status" id="saveStatus"></div></form>`;e.querySelector('[name="category"]').value=r.category||"city"}bindUploads();e.scrollIntoView({behavior:"smooth",block:"start"});$("#editForm").onsubmit=saveForm}
window.closeEditor=()=>$("#editor").classList.remove("open");
async function saveForm(ev){ev.preventDefault();const form=ev.currentTarget,fd=new FormData(form),body={};for(const [k,v] of fd.entries())body[k]=v===""?null:v;body.published=form.published.checked;const problems=validateRecord(body,body.published,form.dataset.id);if(problems.length){$("#saveStatus").textContent="請先完成： "+problems.join("、");return}["start_time","end_time"].forEach(k=>{if(body[k]&&body[k].length===5)body[k]+=":00"});const id=form.dataset.id;try{$("#saveStatus").textContent="儲存中…";await api(table(),{method:id?"PATCH":"POST",query:id?"?id=eq."+encodeURIComponent(id):"",body});$("#saveStatus").textContent="已儲存";closeEditor();load()}catch(e){$("#saveStatus").textContent=e.message}}
if(token)showApp();
</script></body></html>
