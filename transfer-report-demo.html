<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>匯款回報操作體驗｜美遊記</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f8f7;color:#243b3e;font:16px/1.7 system-ui,"Noto Sans TC",sans-serif}main{max-width:580px;margin:7vh auto;padding:30px;background:#fff;border-radius:18px;box-shadow:0 12px 36px #173b4215}h1{font-size:26px;color:#194e58;margin:0 0 12px}.brand{font-weight:750;color:#195c66;letter-spacing:.1em}.info{background:#f1f6f5;border-radius:12px;padding:16px;white-space:pre-line}label{display:block;font-weight:650;margin:18px 0 6px}input{display:block;width:100%;padding:12px;border:1px solid #bdcecb;border-radius:9px;font:inherit}button{margin-top:20px;background:#195c66;border:0;border-radius:10px;color:#fff;font:inherit;font-weight:700;padding:13px 24px;cursor:pointer}button:disabled{opacity:.5}small{color:#637579}#msg{font-weight:650}.notice{background:#fff4d9;border:1px solid #f1d48b;border-radius:10px;padding:12px;margin-bottom:18px}@media(max-width:600px){main{margin:20px 12px;padding:22px}}</style></head>
<body><main><p class="brand">美遊記 NICE TRIP</p><div class="notice"><b>操作體驗版｜不會送出資料</b><div>此頁使用虛擬活動及虛擬訂單，不會連接正式資料庫、寄送 Email 或通知後台。請勿填入真實銀行資料。</div></div><h1>回報匯款資料</h1><p>請核對報名資料，完成匯款後填寫帳號末五碼。</p><div class="info" id="info">活動：測試小旅行（虛擬）\n日期：2026-12-26\n報名編號：NT-20261021-DEMO00\n人數：1\n應付金額：NT$ 500（模擬）</div><form id="form"><label for="last5">匯款帳號末五碼（必填）</label><input id="last5" inputmode="numeric" autocomplete="off" pattern="[0-9]{5}" maxlength="5" required placeholder="測試請輸入 12345"><label for="memo">匯款備註（選填）</label><input id="memo" maxlength="60" placeholder="例如：操作測試"><button id="submit" type="submit">送出匯款回報（模擬）</button></form><p id="msg" role="status" aria-live="polite"></p><p><small>正式流程中，送出匯款回報不代表已確認收款，仍須等待美遊記查帳。此頁僅供操作體驗，不會儲存任何輸入資料。</small></p></main>
<script>"use strict";document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const last5=document.getElementById("last5").value.trim();if(!/^[0-9]{5}$/.test(last5)){document.getElementById("msg").textContent="請輸入正確的5位數字";return;}document.getElementById("form").hidden=true;document.getElementById("msg").textContent="模擬回報成功！這是操作體驗，沒有送出、儲存或通知任何資料。";});</script></body></html>
