}.quick{margin:14px 0 18px}.quick div{padding:12px 14px}.section{padding:22px 0}.section h2{font-size:26px;margin-bottom:10px}.lead{font-size:16px;line-height:1.7;margin:7px 0}.features,.highlights{gap:10px}.tile{padding:16px}.plan{padding:16px}.action{padding:8px 0}}</style></head><body><header class="head"><div class="wrap nav"><a class="brand" href="index.html">美遊記<small>NICE TRIP</small></a><a class="back" href="activities.html">← 回近期活動</a></div></header><main id="app"><section class="error"><div class="wrap">正在載入活動詳情…</div></section></main><div class="action" id="action" hidden><div class="wrap"><p id="actionNote">完整閱讀活動資訊後，再進行報名。</p><a class="btn" id="registerBtn">我要報名 →</a></div></div><script>
const DETAIL={"beitou-20261010":{intro:["如果台北是一座快速前進的城市，那麼北投，就是讓人慢下來呼吸的地方。","北投的故事，從來不只有溫泉。鐵路帶來旅人，溫泉形成聚落，公園成為生活的一部分；公共浴場、日式建築、山林古寺與終年升騰的地熱煙霧，共同形塑出今天我們所看見的北投。","這趟小旅行，我們從一座百年車站開始。沿著昔日人們前往溫泉鄉的方向慢慢前行，從新北投車站、北投公園、北投圖書館、北投溫泉博物館，一路走向地熱谷與普濟寺。短短一段路，卻可以讀到不同時代留下來的城市記憶。"],features:[["🏛 文化閱讀｜讀懂一座溫泉城市如何誕生","從鐵道、公共浴場到日式建築，理解北投如何一步步形成今日獨特的城市樣貌。"],["♨️ 溫泉記憶｜不泡湯，也能真正認識北投","從溫泉博物館走向地熱谷，看見溫泉如何影響北投的觀光、生活與地方文化。"],["🌿 城市慢旅｜把兩個小時留給自己","沿著公園、溪流、綠蔭與溫泉地景慢慢前行，不趕景點，用步行重新感受城市。"],["📖 故事導覽｜讓建築不再只是一棟建築","百年車站、公共浴場、現代圖書館與山林古寺，每一座建築，都是不同時代留下的一頁北投故事。"]],highlights:[["新北投車站","旅行，從一座百年木造車站開始","抬頭看看車站最有辨識度的圓形老虎窗。從鐵道的出現開始，理解旅人如何進入北投，也揭開這座溫泉鄉的近代觀光故事。"],["北投公園","一座公園，也是一座城市生活的縮影","當溫泉不再只是自然資源，而開始進入人們的休閒生活，北投也逐漸形成獨特的溫泉聚落。沿著綠蔭前行，閱讀城市與公共空間的關係。"],["北投圖書館","當一座圖書館，成為森林的一部分","木構、大片窗景、綠意與自然光線，讓現代建築安靜地融入北投公園。從歷史走到當代，看見北投不同時代的建築表情。"],["北投溫泉博物館","百年前的人們，是怎麼泡湯的？","走近昔日公共浴場，從空間、建築與生活方式，回到北投溫泉文化蓬勃發展的年代。"],["地熱谷","所有故事，最後都要回到這片土地","終年蒸騰的白煙、熱氣與特殊地景，是北投最直接也最震撼的自然表情。站在這裡，也更容易理解：為什麼北投會成為一座溫泉之鄉。"],["普濟寺","離開溫泉煙霧，走進山林裡的寧靜","旅程最後，走進隱身山林的日式古寺。從自然、生活走向信仰，讓兩個小時的北投旅行，在安靜的山林之間收尾。"]],route:"捷運新北投站（集合）→ 新北投車站 → 北投公園 → 北投圖書館 → 北投溫泉博物館 → 地熱谷 → 普濟寺（賦歸）",guide:"為降低導覽音量對環境的干擾，活動全程使用無線導覽機，並提供全新耳機；如有個人配戴習慣，歡迎自備 3.5mm 圓孔插頭有線耳機。"},
"xizhi-gongbeidian-20261011":{
intro:["旅行不一定要去很遠。","有時候，只要離開熟悉的街道，往山裡多走幾步，城市的聲音就會慢慢退去。","拱北殿最迷人的地方，不只是某一棟建築、某一座橋，也不只是某個拍照角度，而是整座寺院與山林共同形成的空間。山勢決定了道路，道路串起寺院、石橋與岩洞；信仰則讓這些空間有了人的故事。","因此，這趟行旅不以「走過多少景點」為目的，而是試著用兩個小時，好好閱讀一座寺院。閱讀建築，也閱讀山林；閱讀信仰，也閱讀地方。","當腳步慢下來，原本只是經過的地方，也許就會開始說故事。城市，是一本文字豐富的書。旅行，是最溫柔的閱讀方式。"],
features:[["🏛 文化｜讀懂百年古剎","從寺院建築、空間配置與地方故事出發，理解拱北殿如何成為汐止重要的信仰與文化地標。"],["🌿 山林｜走進寺院秘境","石橋、岩洞、樹林與山徑交錯，寺院不是孤立的建築，而是與自然共同構成一幅完整風景。"],["👣 慢行｜用腳步閱讀空間","不匆忙趕點，而是沿著寺院與山勢行走，在移動之間理解空間，也發現平常容易忽略的細節。"],["🧘 療癒｜把時間慢下來","離開城市的速度，在山林、步行與停留之間，讓身體重新找到自己的節奏。"]],
highlights:[["拱北殿","汐止地標性宗教建築","莊嚴大氣，廟埕遠眺前方，視野遼闊。"],["彼岸橋","走過石橋，走進一段心靈旅程","走過石橋，彷彿也走進一段超脫的心靈旅程。"],["八仙洞","承載地方傳說與神話想像","傳說的岩洞，承載了地方的傳說與神話想像。"],["後山步道","四季有景的山林步道","漫步林間，宛如走進一幅山水畫。"],["雙拱橋","古色古香的橋梁建築","宛如一幅圓滿的畫境。"]],
route:"汐止拱北殿（集合）→ 彼岸橋 → 正殿 → 八仙洞 → 後山步道 → 雙拱橋 → 正殿（解散）",
guide:"為降低導覽音量對環境的干擾，活動全程使用無線導覽機，並提供全新耳機；如有個人配戴習慣，歡迎自備 3.5mm 圓孔插頭有線耳機。"
},
"muzha-20261017":{
intro:["旅行，不一定要去很多地方；有時候，把一個地方真正看懂，就是一趟好旅行。","台灣擁有豐富的寺廟文化，但我們走進一座廟，常常參拜、拍照、看過主殿，就離開了。指南宮卻值得用另一種方式旅行。","這座依山而建的百年道場，擁有廣大的宗教空間。殿宇、參道、亭閣、庭園、山林與眺望空間層層展開，不同信仰、建築與時代，也在這座山上留下痕跡。","因此，「木柵小旅行」不以景點數量為目標，而是把指南宮視為一座完整的宗教文化地景。我們從建築閱讀信仰，從信仰理解文化，從山林看見道場與地方的關係。","希望旅程結束之後，你得到的不只是「我來過指南宮」，而是——原來，一座寺廟可以這樣旅行。","這也是我們所理解的宗教觀光：尊重信仰、理解文化、閱讀空間，讓寺廟成為認識地方與台灣文化的一扇門。"],
features:[["01｜宗教觀光｜把寺廟變成一座文化目的地","不只是參拜，也不只是聽典故。從旅行的角度閱讀宗教空間，看見寺廟所承載的歷史、建築、信仰與地方文化。"],["02｜百年道場｜真正走進指南宮","以指南宮為旅程核心，從呂祖信仰到不同殿宇與空間，理解這座百年道場如何一步步形成今日的文化地景。"],["03｜山林宮觀｜建築不是孤立存在","沿著山勢前行，殿宇、石階、亭閣、庭園與林蔭不斷轉換。指南宮真正迷人的地方，是宗教建築與自然環境共同構成一座可以「行走」的道場。"],["04｜深度慢遊｜兩小時，把一個地方真正看懂","我們不追求「去了多少景點」，而是在行走、聆聽、觀看與停留之間，重新發現一個你可能曾經來過，卻從未真正讀懂的地方。"]],
highlights:[["從貓空纜車開始","一段離開城市的過程","當纜車逐漸升高，城市退到腳下，山林開始靠近。指南宮的旅行，其實在抵達寺廟以前就已經開始。"],["迎仙亭","為什麼指南宮選擇在這座山上？","從地勢與山林環境開始閱讀指南宮。宗教建築為什麼出現在這裡？一座道場與山之間，又有什麼關係？"],["山林步道","廟宇之外，也是道場之內","指南宮的精彩不只藏在殿堂裡。沿著林蔭、石階與步道前行，理解宗教空間如何隨著山勢展開。"],["月娘筊杯椅","傳統信仰如何走進當代生活？","熟悉的筊杯成為公共空間中的設計語彙。從一張椅子，看見宗教符號如何離開神桌，走進生活與觀光場域。"],["自在茶亭","當茶山遇見宗教地景","指南宮所在的木柵、貓空山區與茶文化有著密切關係。從山林中的停留空間，看見信仰、休憩與地方環境如何彼此交會。"],["純陽寶殿","走進呂祖信仰的核心","為什麼指南宮以呂洞賓為核心信仰？從純陽寶殿開始，理解呂祖文化以及指南宮百年道場的重要精神脈絡。"],["不只一種信仰","指南宮為什麼如此特別？","當不同宗教傳統在同一座山中相遇，我們看到的不只是神祇與殿堂，更是台灣宗教文化長期交流、融合與包容所留下的空間痕跡。"],["大雄寶殿","從一座佛殿看見宗教文化的交會","走進不同於純陽寶殿的宗教空間，從建築、配置與信仰內容，觀察指南宮多元而特殊的宗教文化面貌。"]],
route:"貓纜指南宮站（集合）→ 迎仙亭 → 櫻花林 → 月娘筊杯椅 → 自在茶亭 → 純陽寶殿 → 大雄寶殿 → 貓纜指南宮站（賦歸）",
guide:"為降低導覽音量對環境的干擾，活動全程使用無線導覽機，並提供全新耳機；如有個人配戴習慣，歡迎自備 3.5mm 圓孔插頭有線耳機。"
},
"keelung-xiandong-20261018":{
intro:["當海蝕洞成為信仰空間，我們看見了基隆另一種模樣。","基隆是一座與海共生的城市。但認識基隆，不一定要從港口開始。","在基隆港西北側的山巖裡，海水經年累月侵蝕岩層，留下幽深曲折的天然洞穴。後來，人走進洞穴，在岩壁之間留下佛像、石刻與信仰，使原本由自然力量形成的空間，逐漸成為一處特殊的人文地景。這就是仙洞巖最迷人的地方。","它既是自然地景，也是宗教空間；既保存地質的時間，也留下人的記憶。","因此，這趟旅行我們不急著「打卡」。我們要慢慢走進洞穴，看岩壁、看石刻、看佛像，也感受光線從洞口進入幽暗空間時，所形成的特殊氛圍。","接著走向佛手洞、仙洞公園與港灣周邊，重新理解基隆這座城市與海洋、山巒、聚落及信仰之間的關係。","城市，是一本文字豐富的書。旅行，是最溫柔的閱讀方式。"],
features:[["🌊 自然｜走進海洋留下的時間","仙洞巖原是一處天然海蝕洞。走進岩洞，不只是看奇景，而是在閱讀海洋經年累月刻畫土地所留下的痕跡。"],["🏮 信仰｜看見山洞如何成為一座廟","天然洞穴之中供奉觀世音菩薩及諸佛菩薩，岩壁還保存佛像、題刻等人文痕跡。自然形成的空間，因人的信仰而有了新的生命。"],["🪨 探索｜穿越仙洞巖與佛手洞","幽暗洞穴、狹窄岩道、一線天與天然岩壁，讓這趟文化走讀多了一點探險感。從黑暗走向光亮，也是仙洞最令人難忘的體驗之一。"],["⚓ 港都｜從山洞重新閱讀基隆","離開洞穴，視線重新回到山、海、港灣與聚落。你會發現，仙洞不是一處孤立景點，而是理解基隆港都發展與地方生活的一扇入口。"]],
highlights:[["仙洞巖","大自然打造的信仰空間","天然海蝕洞如何變成宗教聖地？走進洞穴，看佛像、石刻與岩壁交會，理解自然地景如何在人們長時間的使用之下，成為具有文化意義的信仰空間。"],["一線天","從幽暗走向光亮","沿著曲折狹窄的岩洞前進，有些地方甚至必須微微側身。當洞外光線從岩縫出現，仙洞不再只是「看風景」，而成為一次真正用身體感受空間的旅行。"],["仙洞公園","站在山海之間看基隆","離開洞穴、走向高處，重新把視野交給山海與港灣。從這裡理解，仙洞巖為什麼會出現在這裡，也看見聚落如何依著港灣與山勢發展。"],["聖安宮","港灣旁的地方信仰","從洞穴中的佛教信仰走向地方廟宇，看見不同形式的宗教空間如何進入居民日常，也理解港都居民與信仰之間長久而緊密的關係。"],["佛手洞","尋找大自然留下的一隻手","走進另一座天然洞穴，在岩壁深處尋找因自然風化形成、形似巨大手掌的岩石紋理。這一次不談神蹟，而是從地質與傳說之間，看見人如何為自然奇景賦予故事。"]],
route:"基隆仙洞巖牌樓前（集合）→ 仙洞巖 → 仙洞公園 → 聖安宮 → 佛手洞 → 廟口夜市（賦歸）",

"xinzhuang-2026-10-24":{
intro:["沿著一條老街，讀懂一座城市如何誕生。","城市從來不是突然出現的。有人來了，聚落形成了；有了生意，街道熱鬧了；人們需要寄託，廟宇建立了；生活富足之後，戲曲、娛樂與飲食也逐漸走進街巷。","新莊老街，就是這段城市發展歷程留下來的一本立體史書。","三百多年來，河港、商業、信仰與庶民生活彼此交織，在短短一段街區裡，留下古廟、老店、戲館巷、米市巷，以及一代又一代新莊人的生活記憶。","因此，這趟旅程不只是「看古蹟」。我們希望帶著大家閱讀：一座廟，為什麼出現在這裡？一條巷子，為什麼與戲曲有關？一家老店，為什麼能陪伴地方走過百年？","當這些看似獨立的故事重新連在一起，你會發現——原來一條老街，就能讀懂一座城市。","城市，是一本文字豐富的書。旅行，是最溫柔的閱讀方式。"],

"yuanshan-20261025":{
intro:["建築，是一座城市留下來的時間證據。","我們經常經過一棟老房子、一座寺院、一片庭園，卻很少停下來想：百年前的人，怎麼住？他們如何理解家庭與生活？不同時代，又如何改變一座城市的模樣？","這一次，我們從林安泰古厝出發。走進紅磚、燕尾與庭院之間，閱讀傳統閩南宅第裡的家族秩序與生活智慧。","接著來到圓山別莊，從洋樓、迴廊與庭園，看見台北逐漸走向現代城市的另一種生活風景。","再走進王大閎建築劇場。時間來到戰後台灣。建築不再只是遮風避雨的房子，而成為建築師思考「人應該如何生活」的一種語言。","最後來到臨濟護國禪寺。在城市快速變動的節奏之外，一座禪寺保留了另一種觀看時間與空間的方法。","清代、日治、戰後、當代。四個場域，看似彼此不同，卻共同寫下了台北百年的城市故事。","城市，是一本文字豐富的書。旅行，是最溫柔的閱讀方式。"],

"sheliao-2026-10-31":{
intro:["一座小島，為什麼有這麼多故事？","和平島過去稱為「社寮島」。","它的位置就在基隆港東北側，看似只是城市邊緣的一座小島，卻因為天然港灣與海上交通的位置，成為不同時代人群往來的重要節點。","因此，今天走在和平島上，我們看到的不只是「景點」。一座橋，是交通史。一處造船廠遺構，是產業史。一個聚落，是移民與族群史。一間廟宇，則保存著居民如何面對海洋、生活與未知的共同記憶。","這就是社寮最迷人的地方——地方不大，歷史卻很深。","城市，是一本文字豐富的書。旅行，是最溫柔的閱讀方式。"],

highlights:[["從彩色漁港，看見港都的另一面","","正濱漁港不只有繽紛彩色屋。從漁港的形成與產業發展出發，看見基隆如何因海而生，也讀懂眼前風景背後的港灣記憶。"],["從阿根納遺構，閱讀消失的產業年代","","巨大的混凝土結構，不只是一處熱門拍照地標。透過阿根納造船廠遺構，認識造船、漁業與港口發展曾經如何形塑這片海岸。"],["跨過和平橋，走進多元文化交會的社寮","","和平島舊稱「社寮島」。數百年間，不同族群因海洋、工作與生活在此相遇。從島嶼地景到原住民族聚落，重新認識基隆豐富而多元的文化面貌。"],["從聚落走到媽祖廟，看見靠海生活的人","","福德信仰、媽祖信仰與居民日常，看似平凡，卻保存著一座海港聚落最真實的生活記憶。旅行最後，我們不只認識歷史，也理解「人如何在一座島上生活」。"]],

"temple-songshan-20261026":{
intro:["一座廟，就是一本立體的文化故事書。","我們經常走進廟宇祈求平安、健康、財富與姻緣，卻很少停下腳步，好好看看眼前的建築。","屋脊上的人物在說什麼故事？龍柱、石雕與剪黏藏著什麼寓意？不同神明為什麼會出現在這裡？一代又一代的人，又為什麼把自己的願望寄託在信仰之中？","其實，廟宇從來不只是祭祀神明的場所，它保存了建築工藝、民間信仰、地方記憶，也承載著臺灣人對善惡、平安、富足、人際關係與人生的理解。","《廟語心聲》不是帶你「看一間廟」，而是邀請你學會「讀一間廟」。","這一次，我們走進松山霞海城隍廟，從建築、圖騰、神祇與民間故事出發，把看似熟悉的廟宇重新打開。我們希望透過一小時的文化閱讀，讓廟宇成為一座沒有圍牆的文化教室。"],
features:[["① 閱讀建築｜看懂廟宇裡的文化密碼","廟宇為什麼雕龍畫鳳？屋脊上的人物、石雕、剪黏、花鳥瑞獸又代表什麼？從建築格局、傳統工藝到裝飾圖騰，帶你從「看熱鬧」走向「看門道」，發現匠師如何將故事、祝福與人生智慧藏進建築之中。"],["② 閱讀文化｜從神明故事理解臺灣人的生活","為什麼城隍爺被視為地方守護者？人們為什麼向財神祈求富足？月老與和合二仙，又寄託著什麼樣的情感願望？從松山霞海城隍廟的信仰文化出發，不只認識神明，更理解信仰如何回應人們對平安、正義、財富、人際關係與幸福的期待。"],["③ 閱讀人生｜古老故事，其實離我們並不遠","廟宇裡談的不只是神明，也有人生。善惡與責任、得到與失去、人與人的關係，以及每個人對平安幸福的追求，都是跨越時代仍然存在的生命課題。透過傳統故事與文化寓意，讓古老信仰不只是「以前的人相信什麼」，也成為今天重新理解生活的一個角度。"]],
