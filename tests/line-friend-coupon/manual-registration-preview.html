<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美遊記｜好友同行禮測試頁</title>
<style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f3f7f7;color:#183c4a;margin:0}main{max-width:650px;margin:28px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 6px 30px #1232}h1{font-size:1.55rem}label{display:block;margin:15px 0 6px;font-weight:600}select,input,button{font:inherit;padding:12px;border:1px solid #a8bdc2;border-radius:9px;max-width:100%;box-sizing:border-box}input,select{width:100%}button{background:#125a68;color:white;cursor:pointer;border:0;margin-top:16px}button:disabled{opacity:.45}section{background:#eff5f5;border-radius:12px;padding:16px;margin-top:20px}.warn{color:#9c4b0c;font-weight:700}.total{font-size:1.45rem;font-weight:700}.small{font-size:.86rem;color:#526870}</style></head>
<body><main><p class="warn">測試專用｜不是真實報名・不收款・不發券</p><h1>美遊記・好友同行禮</h1><p>模擬活動：城市故事行旅｜LINE 優惠券測試</p><p>票價 NT$500／人。僅供驗證報名介面及優惠流程，不連接正式資料庫。</p>
<label for="qty">參加人數</label><select id="qty"><option>1</option><option>2</option><option>3</option><option>4</option></select>
<label for="mode">報名方式</label><select id="mode"><option value="standard">一般報名（無優惠券）</option><option value="coupon">使用 LINE 好友優惠券（測試）</option></select>
<div id="couponArea" hidden><label for="verified">模擬驗證狀態</label><select id="verified"><option value="none">尚未驗證</option><option value="ok">所有參加者資格已驗證（僅模擬）</option><option value="expired">優惠券已過期</option><option value="used">優惠券已使用</option></select><p class="small">此處不會連線 LINE，也不代表真正取得核銷資格。</p></div>
<section aria-live="polite"><p id="original"></p><p id="discount"></p><p id="total" class="total"></p><p id="message"></p></section>
<button id="submit">模擬送出報名</button><p id="result" role="status"></p><p class="small">不蒐集姓名、電話或電子郵件；無付款、Email、LINE 或 Supabase 連線。</p>
</main><script>
const $=id=>document.getElementById(id);
function update(){const n=Number($("qty").value),gross=n*500,coupon=$("mode").value==="coupon",valid=$("verified").value==="ok";$("couponArea").hidden=!coupon;const discount=coupon&&valid?n*50:0;$("original").textContent="原價：NT$"+gross;$("discount").textContent="模擬折抵：NT$"+discount;$("total").textContent="試算金額：NT$"+(gross-discount);$("message").textContent=!coupon?"一般報名，不需優惠券。":valid?"僅完成模擬試算；正式核銷尚未串接。":"優惠券尚未通過驗證，不能直接折抵；可切換一般報名。";$("submit").disabled=coupon;$("result").textContent="";}
["qty","mode","verified"].forEach(id=>$(id).addEventListener("change",update));
$("submit").addEventListener("click",()=>{$("result").textContent="模擬成功：一般報名流程可繼續。沒有建立任何真實訂單。";});
update();
</script></body></html>
