<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>取消報名｜美遊記 NICE TRIP</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f7;color:#243b3e;font-family:system-ui,"Noto Sans TC",sans-serif;font-size:16px}main{max-width:560px;margin:8vh auto;padding:32px;background:#fff;border-radius:20px;box-shadow:0 12px 36px #173b4216}h1{font-size:26px;margin:0 0 20px;color:#194e58}p{line-height:1.8}#info{background:#f1f6f5;padding:18px;border-radius:12px}button{background:#195c66;border:0;color:#fff;padding:14px 24px;border-radius:10px;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#msg{font-weight:600}small{color:#637579}@media(max-width:600px){main{margin:20px 12px;padding:24px}}</style><main><p style="color:#bc7b31;font-weight:700;letter-spacing:2px">美遊記 NICE TRIP</p><h1>取消報名確認</h1><p>點選確認後才會取消報名。</p><p id="info">載入中</p><button id="confirm" disabled>確認取消報名</button><p id="msg" role="status" aria-live="polite"></p><p><a href="https://nicetrip.tw/activities.html">保留報名，返回近期活動</a></p><small>本頁僅供取消尚未確認收款的付費報名及符合資格的免費活動。已確認收款的訂單請聯絡美遊記依退費規範辦理。請勿轉寄專屬取消連結。</small></main><script>const p=new URLSearchParams(location.hash.slice(1));const no=p.get("no"),token=p.get("token");history.replaceState(null,"",location.pathname);async function run(action){const r=await fetch("https://eanxqqctblwfhtdrhwuk.supabase.co/functions/v1/cancel-registration",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({registration_no:no,cancel_token:token,link_mode:true,action})});const d=await r.json();if(!r.ok||!d.ok)throw Error("無法驗證");return d}const info=document.getElementById("info"),b=document.getElementById("confirm"),m=document.getElementById("msg");if(no&&token)run("preview").then(d=>{info.textContent=d.event_title+" "+d.event_date+" "+d.quantity+"人";b.disabled=!d.cancellable;m.textContent=d.status==="cancelled"?"這筆報名已取消。":d.cancellable?"請確認是否取消。":"這筆報名目前無法自行取消。"}).catch(()=>info.textContent="取消連結無效");else info.textContent="取消連結不完整";b.onclick=async()=>{b.disabled=true;try{await run("cancel");m.textContent="報名已成功取消，請查看取消通知信。";b.hidden=true}catch{m.textContent="取消未完成，請聯絡美遊記。";b.disabled=false}};</script></html>
