<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動滿意度問卷｜美遊記 NICE TRIP</title><style>body{margin:0;background:#f5f9f7;color:#153f49;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:32px 18px 60px}.card{background:#fff;border:1px solid #d9e6e2;border-radius:22px;padding:28px;margin:18px 0}h1{font-size:32px;margin:0 0 8px}h2{font-size:20px}.muted{color:#617b80}.field{margin:20px 0}.field label{display:block;font-weight:700;margin-bottom:9px}select,textarea,input{width:100%;box-sizing:border-box;border:1px solid #bdd1cc;border-radius:12px;padding:12px;font:inherit;background:#fff}.scale{display:flex;gap:8px;flex-wrap:wrap}.scale label{font-weight:400;border:1px solid #bdd1cc;border-radius:999px;padding:9px 13px;cursor:pointer}.scale input{width:auto;margin-right:5px}button{border:0;border-radius:999px;background:#126c78;color:#fff;font-weight:700;font-size:17px;padding:13px 26px;cursor:pointer}.status{margin-top:14px}.hidden{display:none}.brand{font-weight:800;letter-spacing:.12em}</style></head><body><main class="wrap"><div class="brand">美遊記 NICE TRIP</div><div class="card"><h1>活動滿意度問卷</h1><p class="muted">謝謝您參加美遊記活動。您的回饋將用於改善活動品質與年度社會影響成效統計。</p><div style="margin:18px 0;padding:16px;border:2px solid #126c78;border-radius:14px;font-weight:800;font-size:18px;line-height:1.7">評分方式請注意：<br>★ 1 分＝非常不好／非常不同意<br>★★★★★ 5 分＝非常好／非常同意<br><span class="muted" style="font-weight:500">分數越高，代表您的評價越好。</span></div><div id="eventInfo">讀取活動資料中…</div></div><form id="form" class="card hidden"><div id="questions"></div><h2>關於您與未來活動</h2><div class="field"><label>年齡（選填）</label><select id="age_group"><option value="">請選擇</option><option>18歲以下</option><option>18–29歲</option><option>30–39歲</option><option>40–49歲</option><option>50–59歲</option><option>60歲以上</option></select></div><div class="field"><label>性別（選填）</label><select id="gender"><option value="">請選擇</option><option>女性</option><option>男性</option><option>其他／不回答</option></select></div><div class="field"><label>較喜歡的活動時段（選填）</label><select id="preferred_time"><option value="">請選擇</option><option>上午</option><option>下午</option><option>夜間／晚上</option><option>皆可</option></select></div><div class="field"><label>未來最希望參加哪些活動？（可複選）</label><div class="scale" id="future_interests"><label><input type="checkbox" value="城市故事行旅">城市故事行旅</label><label><input type="checkbox" value="廟宇文化">廟宇文化</label><label><input type="checkbox" value="自然生態">自然生態</label><label><input type="checkbox" value="身心健康">身心健康</label><label><input type="checkbox" value="文化講座">文化講座</label><label><input type="checkbox" value="其他">其他</label></div></div><div class="field"><label for="comments">想對美遊記說的話（選填）</label><textarea id="comments" rows="5" maxlength="1000"></textarea></div><button type="submit">送出問卷</button><div id="status" class="status"></div></form></main><script>const SB="https://eanxqqctblwfhtdrhwuk.supabase.co",KEY="sb_publishable_C_5cBiXJWq2zVyWmgnMZbQ_W4aonYIy",slug=new URLSearchParams(location.search).get("event");const info=document.getElementById("eventInfo"),form=document.getElementById("form"),qs=document.getElementById("questions"),statusEl=document.getElementById("status");let eventData=null;const cityCore=[["overall_satisfaction","您對本次活動的整體滿意度？"],["professional_quality","導覽／講師內容是否清楚、專業且容易理解？"],["cultural_understanding","活動是否增加您對在地文化、歷史或故事的理解？"],["cultural_preservation","參加活動後，是否更認同文化保存與地方文化傳承的重要性？"],["environmental_friendliness","活動是否讓您更願意以步行、大眾運輸等友善方式探索城市？"],["social_connection","活動是否增加您與地方、人群或社區之間的連結感？"],["wellbeing_benefit","活動是否帶給您放鬆、愉悅或身心上的正向感受？"],["revisit_intent","未來若有其他美遊記活動，您願意再次參加嗎？"],["recommend_intent","您願意把美遊記活動推薦給親友嗎？"],["esg_csr","整體而言，您認為這類活動對文化、社會或永續發展具有正向價值嗎？"]];function scale(name,label){return '<div class="field"><label>'+label+'</label><div class="muted" style="margin-bottom:8px;font-weight:700">1 分＝非常不好／非常不同意　→　5 分＝非常好／非常同意</div><div class="scale">'+[1,2,3,4,5].map(n=>'<label><input required type="radio" name="'+name+'" value="'+n+'">'+n+' '+(n===1?"★ 不好":n===5?"★★★★★ 很好":"★".repeat(n))+'</label>').join("")+'</div></div>'}async function init(){if(!slug){info.textContent="找不到活動識別碼。";return}try{const r=await fetch(SB+"/rest/v1/site_activities?slug=eq."+encodeURIComponent(slug)+"&select=slug,title,event_date,service",{headers:{apikey:KEY}}),d=await r.json();if(!r.ok||!d[0])throw new Error("找不到活動資料");eventData=d[0];info.innerHTML="<h2>"+eventData.title+"</h2><p>"+(eventData.event_date||"")+"</p>";const questionnaire=eventData.service==="city"?{type:"city",version:"v1",core:cityCore}:null;if(!questionnaire){info.innerHTML+="<p class=\"muted\">此服務的專屬滿意度問卷尚未啟用。</p>";form.classList.add("hidden");return}window.activeQuestionnaire=questionnaire;qs.innerHTML=questionnaire.core.map(x=>scale(x[0],x[1])).join("");form.classList.remove("hidden")}catch(e){info.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();statusEl.textContent="送出中…";const fd=new FormData(form),body={event_slug:eventData.slug,event_title:eventData.title,event_date:eventData.event_date,service_type:eventData.service,response_source:new URLSearchParams(location.search).get("source")||"website",questionnaire_type:(window.activeQuestionnaire||{}).type||eventData.service,questionnaire_version:(window.activeQuestionnaire||{}).version||"v1",overall_satisfaction:Number(fd.get("overall_satisfaction")),professional_quality:Number(fd.get("professional_quality")),recommend_intent:Number(fd.get("recommend_intent")),cultural_understanding:Number(fd.get("cultural_understanding")),wellbeing_benefit:Number(fd.get("wellbeing_benefit")),cultural_preservation:Number(fd.get("cultural_preservation")),environmental_friendliness:Number(fd.get("environmental_friendliness")),social_connection:Number(fd.get("social_connection")),revisit_intent:Number(fd.get("revisit_intent")),esg_csr:Number(fd.get("esg_csr")),age_group:document.getElementById("age_group").value||null,gender:document.getElementById("gender").value||null,preferred_time:document.getElementById("preferred_time").value||null,comments:document.getElementById("comments").value.trim()||null,answers:{future_interests:[...document.querySelectorAll("#future_interests input:checked")].map(x=>x.value)}};try{const r=await fetch(SB+"/rest/v1/activity_feedback",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});if(!r.ok)throw new Error("問卷送出失敗，請稍後再試。");form.innerHTML="<h2>謝謝您的回饋</h2><p>您的意見已成功送出，將成為美遊記持續改善活動的重要參考。</p>"}catch(err){statusEl.textContent=err.message}};init();</script></body></html>
