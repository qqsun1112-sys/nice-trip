<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>臨時公告管理｜美遊記 NICE TRIP</title><style>*{box-sizing:border-box}body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;background:#f7faf9;color:#294a50;line-height:1.7}header{background:white;border-bottom:1px solid #dce7e4;padding:18px 20px}header a{color:#17677a}main{max-width:820px;margin:30px auto;padding:0 18px 60px}h1{color:#164b57}.card{background:#fff;border:1px solid #dce7e4;border-radius:14px;padding:25px}label{display:block;font-weight:700;margin-top:16px}input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #ccdcd8;border-radius:8px}textarea{min-height:95px}input[type=checkbox]{width:auto}button{background:#17677a;color:white;border:0;border-radius:25px;padding:12px 22px;cursor:pointer;font:inherit;font-weight:700;margin-top:20px}button:disabled{opacity:.6}.note{background:#fff8e9;border-left:4px solid #a17d3d;padding:12px 15px}.status{min-height:26px;margin-top:12px}a{color:#17677a}</style></head><body><header><a href="admin.html">← 返回美遊記後台</a></header><main><h1>臨時公告管理</h1><p class="note">僅管理首頁臨時公告的顯示狀態與摘要。完整公告頁內容仍由網站版本控管。發布後會顯示在首頁；停止發布即可下架，不影響活動報名。公告將在設定的截止時間自動停止顯示。</p><div class="card" id="manager" hidden><label for="title">公告標題</label><input id="title" maxlength="100"><label for="summary">首頁摘要</label><textarea id="summary" maxlength="500"></textarea><label for="ends">自動下架時間（台灣時間）</label><input id="ends" type="datetime-local"><label><input id="published" type="checkbox"> 啟用首頁公告（對外顯示）</label><p><a href="typhoon-notice-202610.html" target="_blank" rel="noopener">查看完整公告頁</a></p><button id="save">儲存公告設定</button><div id="status" class="status" role="status"></div></div><div id="loginHint" class="note">正在檢查管理者登入狀態…</div></main><script>(function(){const url="https://eanxqqctblwfhtdrhwuk.supabase.co/rest/v1/site_notices",key="sb_publishable_C_5cBiXJWq2zVyWmgnMZbQ_W4aonYIy",token=sessionStorage.getItem("nt_admin_token");const $=s=>document.querySelector(s),hint=$("#loginHint"),status=$("#status");if(!token){hint.innerHTML='請先從 <a href="admin.html">網站內容管理</a> 登入，再開啟公告管理。';return}const headers={"apikey":key,"Authorization":"Bearer "+token,"Content-Type":"application/json"};let record=null;function dateLocal(v){if(!v)return "";const d=new Date(v);return new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(d).replace(" ","T")}fetch(url+"?id=eq.typhoon-202610&select=*",{headers}).then(async r=>{if(!r.ok)throw Error("無法讀取公告設定，請確認登入權限");return r.json()}).then(rows=>{record=rows[0];if(!record)throw Error("尚未建立公告資料");$("#title").value=record.title;$("#summary").value=record.summary;$("#ends").value=dateLocal(record.ends_at);$("#published").checked=record.published;$("#manager").hidden=false;hint.hidden=true}).catch(e=>{hint.textContent=e.message});$("#save").onclick=async function(){if(!record)return;const title=$("#title").value.trim(),summary=$("#summary").value.trim(),ends=$("#ends").value;if(!title||!summary){status.textContent="標題與摘要不可空白";return}const body={title,summary,published:$("#published").checked,ends_at:ends?new Date(ends+"+08:00").toISOString():null,updated_at:new Date().toISOString()};if(body.published&&ends&&new Date(body.ends_at)<=new Date()){status.textContent="截止時間已過，請先修改下架時間";return}const btn=$("#save");btn.disabled=true;status.textContent="正在儲存…";try{const r=await fetch(url+"?id=eq.typhoon-202610",{method:"PATCH",headers:{...headers,Prefer:"return=representation"},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());const updated=await r.json();if(updated.length!==1)throw Error("未更新任何資料，請檢查管理者權限");record=updated[0];status.textContent="設定已儲存。"+(record.published?"公告已啟用（依開始／結束時間顯示）。":"公告目前停用。")}catch(e){status.textContent="儲存失敗："+e.message}finally{btn.disabled=false}}})();</script></body></html>
