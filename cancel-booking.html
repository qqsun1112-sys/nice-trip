<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>取消報名｜美遊記</title><main><h1>取消報名確認</h1><p>點選確認後才會取消報名。</p><p id="info">載入中</p><button id="confirm" disabled>確認取消報名</button><p id="msg"></p></main><script>const p=new URLSearchParams(location.hash.slice(1));const no=p.get("no"),token=p.get("token");history.replaceState(null,"",location.pathname);async function run(action){const r=await fetch("https://eanxqqctblwfhtdrhwuk.supabase.co/functions/v1/cancel-registration",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({registration_no:no,cancel_token:token,link_mode:true,action})});const d=await r.json();if(!r.ok||!d.ok)throw Error("無法驗證");return d}const info=document.getElementById("info"),b=document.getElementById("confirm"),m=document.getElementById("msg");if(no&&token)run("preview").then(d=>{info.textContent=d.event_title+" "+d.event_date+" "+d.quantity+"人";b.disabled=!d.cancellable;m.textContent=d.cancellable?"請確認是否取消。":"這筆報名目前無法自行取消。"}).catch(()=>info.textContent="取消連結無效");else info.textContent="取消連結不完整";b.onclick=async()=>{b.disabled=true;try{await run("cancel");m.textContent="報名已取消，請查看取消通知信。"}catch{m.textContent="取消未完成，請聯絡美遊記。";b.disabled=false}};</script></html>
