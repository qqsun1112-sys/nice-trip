name: Standardize hero image canvases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standardize-hero-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Standardize active hero image files
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          target=(2158,729)
          files=[
            "assets/images/ChatGPT 圖像 2026年9月30日 下午09_58_39.png",
            "assets/images/美遊記：山城團體的溫度旅程.png",
            "assets/images/文化旅程，探索美好生活.png",
            "assets/images/美遊記：走進城市的故事 (1).png",
            "assets/images/走進廟宇，閱讀生活智慧 (1).png",
            "assets/images/六分鐘，讓心安定下來.png",
            "assets/images/美遊記身心平衡之旅 (1).png",
          ]
          for name in files:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f"Missing active hero: {name}")
              im=Image.open(p).convert("RGB")
              if im.size==target:
                  print("already standard",name,im.size)
                  continue
              # Full-bleed blurred background uses the same artwork only; foreground
              # is fitted without distortion or cropping so all original text/subjects remain.
              bg=im.copy()
              scale=max(target[0]/bg.width,target[1]/bg.height)
              bg=bg.resize((round(bg.width*scale),round(bg.height*scale)),Image.Resampling.LANCZOS)
              left=(bg.width-target[0])//2; top=(bg.height-target[1])//2
              bg=bg.crop((left,top,left+target[0],top+target[1])).filter(ImageFilter.GaussianBlur(24))
              scale=min(target[0]/im.width,target[1]/im.height)
              fg=im.resize((round(im.width*scale),round(im.height*scale)),Image.Resampling.LANCZOS)
              x=(target[0]-fg.width)//2; y=(target[1]-fg.height)//2
              bg.paste(fg,(x,y))
              bg.save(p,format="PNG",optimize=True)
              check=Image.open(p)
              assert check.size==target,(name,check.size)
              print("standardized",name,im.size,"->",check.size)
          PY
      - name: Commit standardized hero files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "No image changes needed"
          else
            git commit -m "Standardize primary hero images to 2158x729 [skip ci]"
            git push
          fi
