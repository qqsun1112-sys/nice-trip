<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美遊記｜優惠碼即時折抵測試</title><style>
body{margin:0;background:#f6f5f0;color:#173c46;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:700px;margin:24px auto;background:white;border-radius:16px;padding:26px;box-sizing:border-box}h1{font-size:1.55rem}label{display:block;margin:14px 0 7px;font-weight:650}select,input,button{font:inherit;box-sizing:border-box;border-radius:9px;padding:12px;border:1px solid #b7c7ca}select,input{width:100%}button{background:#176c75;color:white;border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.coupon{border:1px solid #bdd4d0;border-radius:12px;padding:16px;margin-top:20px}.inline{display:flex;gap:8px;align-items:center}.inline input{flex:1;min-width:0}.summary{background:#eaf3f0;border-radius:12px;padding:16px;margin:18px 0}.line{display:flex;justify-content:space-between;gap:12px;margin:10px 0}.total{font-weight:800;font-size:1.25rem}.small{font-size:.86rem;color:#536c73}.warn{color:#98500d}.ok{color:#13724f}#submit{width:100%;margin-top:12px}@media(max-width:600px){main{margin:0;padding:18px;border-radius:0}}
</style></head><body><main><p class="warn"><strong>測試專用｜不是真實報名、不收款、不發券</strong></p><h1>城市故事行旅｜報名表單示範</h1><p class="small">保留原有報名流程，只增加一欄選填優惠碼。此頁不連線 LINE 或美遊記資料庫。</p>
<label for="ticket">票種</label><select id="ticket"><option value="600">一般優惠 NT$600</option><option value="500">早鳥優惠 NT$500</option></select>
<label for="qty">參加人數</label><select id="qty"><option>1</option><option>2</option><option>3</option><option>4</option></select>
<div class="coupon"><label for="code">優惠碼（選填）</label><div class="inline"><input id="code" autocomplete="off" spellcheck="false" placeholder="輸入測試優惠碼 DEMO50A"><button id="apply" type="button">套用</button></div><p class="small">單人試用 DEMO50A；多人可再輸入 DEMO50B、DEMO50C、DEMO50D，每個碼各折 NT$50。</p><p id="feedback" role="status" class="small"></p><p id="applied" class="small"></p><button id="clear" type="button">清除所有優惠碼</button></div>
<section class="summary" aria-live="polite"><div class="line"><span>原始票價合計</span><strong id="gross"></strong></div><div class="line"><span>優惠折抵</span><strong id="discount"></strong></div><hr><div class="line total"><span>試算應付金額</span><span id="total"></span></div><p class="small">折抵為瀏覽器模擬。正式系統須由伺服器驗證、重新計價，並在資料庫交易中完成一次性核銷。</p></section>
<button id="submit" type="button">模擬送出報名</button><p id="result" role="status"></p><p class="small">不收集姓名、電話、LINE ID 或付款資料；不產生訂單、不占名額、不發 Email。</p>
</main><script>
const $=id=>document.getElementById(id),demoCodes=new Set(["DEMO50A","DEMO50B","DEMO50C","DEMO50D"]);let applied=[];
function render(){const gross=Number($("ticket").value)*Number($("qty").value),count=Math.min(applied.length,Number($("qty").value)),discount=count*50;$("gross").textContent="NT$"+gross;$("discount").textContent="−NT$"+discount;$("total").textContent="NT$"+(gross-discount);$("applied").textContent=applied.length?"已套用（僅模擬）："+applied.join("、"):"尚未使用優惠碼";$("result").textContent="";}
$("apply").addEventListener("click",()=>{const code=$("code").value.trim().toUpperCase(),qty=Number($("qty").value);if(!demoCodes.has(code)){$("feedback").textContent="無效的示範優惠碼；一般報名仍可繼續。";return;}if(applied.includes(code)){$("feedback").textContent="這組優惠碼已套用，不能重複折抵。";return;}if(applied.length>=qty){$("feedback").textContent="每位參加者最多一組優惠碼；目前人數已達上限。";return;}applied.push(code);$("code").value="";$("feedback").textContent="已即時試算折抵 NT$50（僅模擬，尚未驗證真實資格）。";render();});
$("clear").addEventListener("click",()=>{applied=[];$("feedback").textContent="優惠碼已清除。";render();});
["ticket","qty"].forEach(id=>$(id).addEventListener("change",()=>{applied=[];$("feedback").textContent="票種或人數變更，已清除舊試算優惠，請重新套用。";render();}));
$("submit").addEventListener("click",()=>{$("result").textContent=applied.length?"優惠碼報名僅完成模擬：正式伺服器核銷尚未串接，沒有建立訂單。":"一般報名模擬完成：沒有建立真實訂單。";});render();
</script></body></html>
