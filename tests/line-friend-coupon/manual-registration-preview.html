<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美遊記｜WELCOME50 第一階段報名折抵測試</title>
<style>body{margin:0;background:#f6f5f0;color:#173c46;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:700px;margin:24px auto;background:white;border-radius:16px;padding:26px;box-sizing:border-box}h1{font-size:1.5rem}label{display:block;margin:14px 0 7px;font-weight:650}select,input,button{font:inherit;box-sizing:border-box;border-radius:9px;padding:12px;border:1px solid #b7c7ca}select,input{width:100%}button{background:#176c75;color:white;border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.coupon{border:1px solid #bdd4d0;border-radius:12px;padding:16px;margin-top:20px}.inline{display:flex;gap:8px;align-items:center}.inline input{flex:1;min-width:0}.summary{background:#eaf3f0;border-radius:12px;padding:16px;margin:18px 0}.line{display:flex;justify-content:space-between;gap:12px;margin:10px 0}.total{font-weight:800;font-size:1.25rem}.small{font-size:.86rem;color:#536c73}.warn{color:#98500d}#submit{width:100%;margin-top:12px}@media(max-width:600px){main{margin:0;padding:18px;border-radius:0}.inline{flex-wrap:wrap}.inline button{width:100%}}</style></head>
<body><main><p class="warn"><strong>獨立測試專用｜不是真實報名、不收款、不發券</strong></p><h1>城市故事行旅｜LINE 好友見面禮</h1>
<p class="small">單一共用優惠碼 WELCOME50；每位符合資格的付費參加者折抵 NT$50，同筆訂單只輸入一次。本頁不連線 LINE 或美遊記資料庫。</p>
<label for="ticket">示範票種</label><select id="ticket"><option value="600">一般票 NT$600</option><option value="500">早鳥票 NT$500</option><option value="0">免費票 NT$0（不適用）</option></select>
<label for="qty">參加人數</label><select id="qty"><option>1</option><option>2</option><option>3</option><option>4</option></select>
<div class="coupon"><label for="code">優惠碼（選填）</label><div class="inline"><input id="code" autocomplete="off" spellcheck="false" placeholder="WELCOME50" aria-describedby="couponHelp"><button id="apply" type="button">試算優惠</button></div><p class="small" id="couponHelp">一人折 NT$50、兩人折 NT$100、三人折 NT$150。限指定付費城市故事行旅；不得與其他優惠券併用；至 2026/12/31 23:59（台灣時間）。</p><p id="feedback" role="status" class="small"></p><button id="clear" type="button">清除優惠碼</button></div>
<section class="summary" aria-live="polite"><div class="line"><span>原始票價合計</span><strong id="gross"></strong></div><div class="line"><span>優惠折抵</span><strong id="discount"></strong></div><hr><div class="line total"><span>試算應付金額</span><span id="total"></span></div><p class="small">此處為示範試算，不代表已核准優惠或完成報名。正式系統須由後端重新計算付款金額。</p></section>
<button id="submit" type="button">模擬送出報名（不建立訂單）</button><p id="result" role="status"></p><p class="small">不收集個資、不產生訂單、不占名額、不發 Email。共用碼不驗證 LINE 領券身分。</p>
</main><script>
const $=id=>document.getElementById(id);let applied=false;
function render(){const unit=Number($("ticket").value),qty=Number($("qty").value),gross=unit*qty,discount=applied&&unit>0?qty*Math.min(50,unit):0;$("gross").textContent="NT$ "+gross.toLocaleString();$("discount").textContent="−NT$ "+discount.toLocaleString();$("total").textContent="NT$ "+(gross-discount).toLocaleString();$("result").textContent="";}
$("apply").addEventListener("click",()=>{const code=$("code").value.trim().toUpperCase();if(code!=="WELCOME50"){$("feedback").textContent="優惠碼不符；一般報名不受影響。";applied=false;}else if(Number($("ticket").value)===0){$("feedback").textContent="免費票不適用優惠。";applied=false;}else{applied=true;$("feedback").textContent="已試算：每位付費參加者折抵 NT$50（僅示範，非正式核銷）。";}render();});
$("clear").addEventListener("click",()=>{applied=false;$("code").value="";$("feedback").textContent="已清除優惠碼。";render();});
["ticket","qty"].forEach(id=>$(id).addEventListener("change",()=>{applied=false;$("feedback").textContent="票種或人數已變更，請重新套用優惠碼。";render();}));
$("submit").addEventListener("click",()=>{$("result").textContent="這是離線示範，沒有送出任何報名資料或付款請求。";});render();
</script></body></html>
