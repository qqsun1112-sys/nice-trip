name: Isolated promotion regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/line-friend-coupon-staging-20261020
    paths:
      - 'tests/line-friend-coupon/**'
      - 'activity-register.html'
      - 'supabase/functions-draft/**'
      - 'supabase/migrations-draft/**'
      - '.github/workflows/promotion-isolated-tests.yml'

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node runtime and test discovery
        run: |
          node --version
          find tests/line-friend-coupon -maxdepth 1 -type f -name '*.test.mjs' -print | sort
      - name: Run isolated promotion regression tests
        run: node --test --test-reporter=spec tests/line-friend-coupon/*.test.mjs
