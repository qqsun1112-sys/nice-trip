<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動滿意度問卷｜美遊記 NICE TRIP</title><style>body{margin:0;background:#f5f9f7;color:#153f49;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:32px 18px 60px}.card{background:#fff;border:1px solid #d9e6e2;border-radius:22px;padding:28px;margin:18px 0}h1{font-size:32px;margin:0 0 8px}h2{font-size:20px}.muted{color:#617b80}.field{margin:20px 0}.field label{display:block;font-weight:700;margin-bottom:9px}select,textarea,input{width:100%;box-sizing:border-box;border:1px solid #bdd1cc;border-radius:12px;padding:12px;font:inherit;background:#fff}.scale{display:flex;gap:8px;flex-wrap:wrap}.scale label{font-weight:400;border:1px solid #bdd1cc;border-radius:999px;padding:9px 13px;cursor:pointer}.scale input{width:auto;margin-right:5px}button{border:0;border-radius:999px;background:#126c78;color:#fff;font-weight:700;font-size:17px;padding:13px 26px;cursor:pointer}.status{margin-top:14px}.hidden{display:none}.brand{font-weight:800;letter-spacing:.12em}</style></head><body><main class="wrap"><div class="brand">美遊記 NICE TRIP</div><div class="card"><h1>活動滿意度問卷</h1><p class="muted">謝謝您參加美遊記活動。您的回饋將用於改善活動品質與年度社會影響成效統計。</p><div id="eventInfo">讀取活動資料中…</div></div><form id="form" class="card hidden"><div id="questions"></div><div class="field"><label for="comments">想對美遊記說的話（選填）</label><textarea id="comments" rows="5" maxlength="1000"></textarea></div><button type="submit">送出問卷</button><div id="status" class="status"></div></form></main><script>const SB="https://eanxqqctblwfhtdrhwuk.supabase.co",KEY="sb_publishable_C_5cBiXJWq2zVyWmgnMZbQ_W4aonYIy",slug=new URLSearchParams(location.search).get("event");const info=document.getElementById("eventInfo"),form=document.getElementById("form"),qs=document.getElementById("questions"),statusEl=document.getElementById("status");let eventData=null;const core=[["overall_satisfaction","整體活動滿意度"],["professional_quality","講師／導覽專業與內容品質"],["recommend_intent","願意推薦給親友"],["cultural_understanding","增加文化理解"],["wellbeing_benefit","對身心放鬆／生活感受有幫助"]];function scale(name,label){return '<div class="field"><label>'+label+' <span class="muted">（1低－5高）</span></label><div class="scale">'+[1,2,3,4,5].map(n=>'<label><input required type="radio" name="'+name+'" value="'+n+'">'+n+'</label>').join("")+'</div></div>'}async function init(){if(!slug){info.textContent="找不到活動識別碼。";return}try{const r=await fetch(SB+"/rest/v1/site_activities?slug=eq."+encodeURIComponent(slug)+"&select=slug,title,event_date,service",{headers:{apikey:KEY}}),d=await r.json();if(!r.ok||!d[0])throw new Error("找不到活動資料");eventData=d[0];info.innerHTML="<h2>"+eventData.title+"</h2><p>"+(eventData.event_date||"")+"</p>";qs.innerHTML=core.map(x=>scale(x[0],x[1])).join("");form.classList.remove("hidden")}catch(e){info.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();statusEl.textContent="送出中…";const fd=new FormData(form),body={event_slug:eventData.slug,event_title:eventData.title,event_date:eventData.event_date,service_type:eventData.service,response_source:"website",overall_satisfaction:Number(fd.get("overall_satisfaction")),professional_quality:Number(fd.get("professional_quality")),recommend_intent:Number(fd.get("recommend_intent")),cultural_understanding:Number(fd.get("cultural_understanding")),wellbeing_benefit:Number(fd.get("wellbeing_benefit")),comments:document.getElementById("comments").value.trim()||null};try{const r=await fetch(SB+"/rest/v1/activity_feedback",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});if(!r.ok)throw new Error("問卷送出失敗，請稍後再試。");form.innerHTML="<h2>謝謝您的回饋</h2><p>您的意見已成功送出，將成為美遊記持續改善活動的重要參考。</p>"}catch(err){statusEl.textContent=err.message}};init();</script></body></html>
